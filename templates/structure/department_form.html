{% extends 'base.html' %}
{% load cmis_extras %}
{% block title %}New Department{% endblock %}
{% block content %}
<h1 class="font-display text-2xl font-semibold mb-4">New Department</h1>
<form method="POST" class="bg-white border border-brand-100 rounded-xl p-6 shadow-sm max-w-xl">
  {% csrf_token %}
  {% field 'Name' 'name' placeholder='e.g. Ushering Department' required=True %}
  {% textarea 'Description' 'description' rows=3 %}
  <div class="mb-3">
    <label class="block text-sm font-medium text-brand-700 mb-1">Leader (optional)</label>
    <select class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm" name="leader_id">
      <option value="">Unassigned</option>
      {% for member in members %}<option value="{{ member.id }}">{{ member.full_name }}</option>{% endfor %}
    </select>
  </div>
  <button class="bg-brand-600 hover:bg-brand-700 text-white rounded-lg px-5 py-2 text-sm">Create Department</button>
</form>
{% endblock %}
