{% extends 'base.html' %}
{% load cmis_extras %}
{% block title %}New Follow-up{% endblock %}
{% block content %}
<h1 class="font-display text-2xl font-semibold mb-4">New Follow-up</h1>
<form method="POST" class="bg-white border border-brand-100 rounded-xl p-6 shadow-sm max-w-xl">
  {% csrf_token %}
  <div class="mb-3">
    <label class="block text-sm font-medium text-brand-700 mb-1">Member *</label>
    <select class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm" name="member_id" required>
      <option value="">Select a member</option>
      {% for member in members %}<option value="{{ member.id }}">{{ member.full_name }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="block text-sm font-medium text-brand-700 mb-1">Reason</label>
    <select class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm" name="reason">
      {% for r in reasons %}<option value="{{ r }}">{{ reason_labels|get_item:r }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="block text-sm font-medium text-brand-700 mb-1">Assign to</label>
    <select class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm" name="assigned_to_id">
      {% for s in staff %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}
    </select>
  </div>
  {% field 'Next follow-up date' 'next_followup_date' type='date' %}
  {% textarea 'Notes' 'notes' rows=3 %}
  <button class="bg-brand-600 hover:bg-brand-700 text-white rounded-lg px-5 py-2 text-sm">Create Follow-up</button>
</form>
{% endblock %}
