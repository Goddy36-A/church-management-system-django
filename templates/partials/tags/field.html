<div class="mb-3">
  <label class="block text-sm font-medium text-brand-700 mb-1" for="{{ name }}">{{ label }}{% if required %} *{% endif %}</label>
  <input class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent"
         type="{{ type }}" id="{{ name }}" name="{{ name }}" value="{{ value|default:'' }}"
         placeholder="{{ placeholder }}" {% if required %}required{% endif %}>
</div>
