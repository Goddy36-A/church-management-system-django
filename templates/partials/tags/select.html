<div class="mb-3">
  <label class="block text-sm font-medium text-brand-700 mb-1" for="{{ name }}">{{ label }}{% if required %} *{% endif %}</label>
  <select class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gold" id="{{ name }}" name="{{ name }}" {% if required %}required{% endif %}>
    {% if blank_label %}<option value="">{{ blank_label }}</option>{% endif %}
    {% for opt_value, opt_label in options %}
      <option value="{{ opt_value }}" {% if opt_value|stringformat:"s" == selected|stringformat:"s" %}selected{% endif %}>{{ opt_label }}</option>
    {% endfor %}
  </select>
</div>
