<div class="mb-3">
  <label class="block text-sm font-medium text-brand-700 mb-1" for="{{ name }}">{{ label }}{% if required %} *{% endif %}</label>
  <textarea class="w-full border border-brand-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gold" id="{{ name }}" name="{{ name }}" rows="{{ rows }}" {% if required %}required{% endif %}>{{ value|default:'' }}</textarea>
</div>
