{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
  <p class="text-5xl font-display font-semibold text-brand-300 mb-2">404</p>
  <h1 class="text-xl font-medium mb-2">Page Not Found</h1>
  <p class="text-sm text-brand-500 max-w-sm">The page you're looking for doesn't exist or may have been moved.</p>
  <a href="{% if user.is_authenticated %}{% url 'dashboard:index' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="mt-4 text-sm text-brand-600 hover:underline">Go Home</a>
</div>
{% endblock %}
